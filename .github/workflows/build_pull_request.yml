name: PR Build

on:
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'core/**'
      - 'common/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'common.gradle.kts'
      - 'settings.gradle.kts'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_pr:
    name: Build & Verify Extensions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build all extensions
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
