name: CI

on:
  push:
    branches:
      - repo
    paths:
      - '**'
      - '!**.md'
      - '!.github/**'
      - '.github/scripts/**'
      - '.github/workflows/build_push.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_CHUNK_SIZE: 15

jobs:
  prepare:
    name: Prepare job
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      latestCommitMessage: ${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}
      matrix: ${{ steps.generate-matrices.outputs.matrix }}
      skipBump: ${{ steps.set-env.outputs.SKIP_BUMP }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set env
        id: set-env
        run: |
          LATEST_COMMIT_MESSAGE=$(git log -1 --pretty=%B)
          echo "LATEST_COMMIT_MESSAGE<<EOF" >> $GITHUB_OUTPUT
          echo "$LATEST_COMMIT_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          skip_bump=false
          case "$LATEST_COMMIT_MESSAGE" in
            *"[skip ci]"*|*"[skip bumping version]"*)
              skip_bump=true
              ;;
          esac
          echo "SKIP_BUMP=$skip_bump" >> $GITHUB_OUTPUT

      - name: Check core changes
        id: modified-core
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            core/**
            common/**
            gradle/libs.versions.toml
          files_separator: " "

      - name: Bump extensions on core changes
        if: steps.modified-core.outputs.any_changed == 'true' && steps.set-env.outputs.SKIP_BUMP != 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          python3 ./.github/scripts/bump-versions.py "${{ steps.set-env.outputs.LATEST_COMMIT_MESSAGE }}" ${{ steps.modified-core.outputs.all_changed_files }}
          git push

      - name: Generate build matrix
        id: generate-matrices
        run: |
          python3 ./.github/scripts/generate-build-matrices.py "HEAD~1" Release

  build:
    name: Build extensions (${{ matrix.chunk.number }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ toJson(fromJson(needs.prepare.outputs.matrix).chunk) != '[]' }}
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > signingkey.jks
            chmod 600 signingkey.jks
          fi

      - name: Build extensions
        env:
          MODULES: ${{ join(matrix.chunk.modules, ' ') }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew $MODULES

      - name: Upload APK artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "apks-chunk-${{ matrix.chunk.number }}"
          path: "**/build/outputs/apk/**/*.apk"
          retention-days: 1

  publish:
    name: Publish repository
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          fetch-depth: 0

      - name: Checkout repo branch (deploy target)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: repo
          path: repo
          fetch-depth: 0

      - name: Initialize repo branch if non-existent
        run: |
          if [ ! -d "repo/.git" ]; then
            mkdir -p repo
            cd repo
            git init -b repo
            git remote add origin https://github.com/${{ github.repository }}.git
          fi

      - name: Download APK artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ~/apk-artifacts

      - name: Create repository artifacts
        run: |
          cd source
          python3 ./.github/scripts/move-built-apks.py
          python3 ./.github/scripts/create-repo.py

      - name: Merge into repo branch
        run: |
          cd repo
          rm -rf repo
          python3 ../source/.github/scripts/merge-repo.py "[]" "../source/repo"

      - name: Deploy to repo branch
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy extensions repo [skip ci]" || exit 0
          git push origin repo --force
